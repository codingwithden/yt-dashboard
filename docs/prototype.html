<title>YT Dashboard Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: app shell for lifestyle creators. Soft lavender-white ground, pill controls, one primary action per screen, a step tracker on every tool. Left rail on desktop, bottom tab bar on phones. */
  :root {
    --bg: #f7f5fa; --surface: #ffffff; --sunk: #efecf4; --fg: #251f2c; --muted: #685f73; --line: #e2dcea;
    --ideas: #bf5a28; --thumbs: #963776; --files: #3f7552; --money: #5254c7; --deal: #9a6a12;
    --ok: #2c7f50; --warn: #bb4426; --on-accent: #ffffff;
    --t-aroll: #bb4426; --t-broll: #3f7552; --t-talking: #bf5a28; --t-vo: #6d4cc0; --t-music: #963776; --t-screenshot: #5254c7; --t-photo: #8a6a12;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16131b; --surface: #211d28; --sunk: #1b1821; --fg: #f2eef6; --muted: #aca4b8; --line: #363040;
      --ideas: #f09f70; --thumbs: #e38bc6; --files: #8fc49f; --money: #a2a3f6; --deal: #e2b55a; --ok: #6cc892; --warn: #f2896a; --on-accent: #16131b;
      --t-aroll: #f2896a; --t-broll: #8fc49f; --t-talking: #f09f70; --t-vo: #b9a1f2; --t-music: #e38bc6; --t-screenshot: #a2a3f6; --t-photo: #e2b55a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16131b; --surface: #211d28; --sunk: #1b1821; --fg: #f2eef6; --muted: #aca4b8; --line: #363040;
      --ideas: #f09f70; --thumbs: #e38bc6; --files: #8fc49f; --money: #a2a3f6; --deal: #e2b55a; --ok: #6cc892; --warn: #f2896a; --on-accent: #16131b;
      --t-aroll: #f2896a; --t-broll: #8fc49f; --t-talking: #f09f70; --t-vo: #b9a1f2; --t-music: #e38bc6; --t-screenshot: #a2a3f6; --t-photo: #e2b55a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.01em; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--money); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); font-size: 0.85em; }
  .muted { color: var(--muted); }
  .ideas { --c: var(--ideas); } .thumbs { --c: var(--thumbs); } .files { --c: var(--files); } .money { --c: var(--money); }

  /* shell */
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
  .rail { position: sticky; top: 0; height: 100vh; background: var(--sunk); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; padding-left: max(14px, env(safe-area-inset-left, 0px)); }
  .brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; display: flex; flex-direction: column; gap: 2px; }
  .brand small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 700; }
  .nav a svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav a:hover { color: var(--fg); background: var(--surface); }
  .nav a.on { color: var(--c, var(--fg)); background: color-mix(in srgb, var(--c, var(--fg)) 12%, var(--surface)); }
  .rail-usage { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .rail-usage .lbl { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c, var(--money)); border-radius: 3px; transition: width .4s ease; }
  .bar.full i { background: var(--warn); }

  .main { min-width: 0; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .inner { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  #view { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .demo-note { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .demo-note b { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--fg); color: var(--bg); padding: 2px 6px; border-radius: 3px; }
  .planswitch { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.15); }
  .linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 4px; }

  /* page head + steps */
  .phead { display: flex; flex-direction: column; gap: 6px; }
  .phead h1 { font-size: clamp(26px, 4vw, 34px); }
  .phead p { color: var(--muted); max-width: 62ch; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 700; color: var(--muted); }
  .steps li span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-family: var(--font-mono); font-size: 12px; }
  .steps li.now { color: var(--fg); border-color: var(--c); }
  .steps li.now span { background: var(--c); color: var(--on-accent); }
  .steps li.done span { background: var(--ok); color: var(--on-accent); }
  .steps li.done span::before { content: "\2713"; }
  .steps li.done span b { display: none; }

  /* generic */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1 1 220px; min-width: 0; }
  .btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .btn:hover { border-color: var(--fg); }
  .btn.primary { background: var(--c, var(--money)); border-color: var(--c, var(--money)); color: var(--on-accent); padding: 11px 18px; font-size: 16px; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: 0.55; cursor: not-allowed; }
  .btn .lock { font-size: 12px; }
  .hint { font-size: 14px; color: var(--muted); }
  .hint b { color: var(--fg); }
  label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
  input[type="text"], textarea, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0; }
  textarea { resize: vertical; line-height: 1.55; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--chip, var(--muted)) 16%, transparent); color: var(--chip, var(--muted)); white-space: nowrap; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--chip, var(--muted)); }
  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* home */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; transition: transform .15s ease, border-color .15s ease; }
  .tile:hover { transform: translateY(-2px); border-color: var(--c); }
  .tile h2 { font-size: 20px; color: var(--c); }
  .tile .stat { font-size: 14px; color: var(--muted); }
  .tile .go { margin-top: auto; font-weight: 700; color: var(--c); }
  .upnext { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .deals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .deals li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .deals li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bigq { font-size: 15px; color: var(--muted); }

  /* ideas */
  .idea-input { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: start; }
  .result { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .result h3 { font-size: 15px; }
  .result ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .result .empty { color: var(--muted); }
  .board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 220px; transition: background .15s ease, border-color .15s ease; }
  .col.over { border-color: var(--ideas); background: color-mix(in srgb, var(--ideas) 10%, var(--sunk)); }
  .col-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
  .col-head .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: grab; font-size: 14px; text-align: left; width: 100%; }
  .card:hover { border-color: var(--ideas); }
  .card.dragging { opacity: 0.4; }
  .card.fresh { animation: fresh 2.4s ease; }
  @keyframes fresh { 0%, 40% { box-shadow: 0 0 0 3px var(--ideas); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .card b { font-size: 14px; line-height: 1.3; }
  .card .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .deal { --chip: var(--deal); }
  .deal.soon { --chip: var(--warn); }
  .card .hook { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .addcard { border: 1px dashed var(--line); background: none; border-radius: 6px; padding: 8px; color: var(--muted); cursor: pointer; font-weight: 700; font-size: 13px; }
  .addcard:hover { color: var(--fg); border-color: var(--fg); }

  /* thumbnails */
  .tgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative; min-width: 0; }
  .tcard.winner { border: 2px solid var(--thumbs); }
  .tcard .wbadge { position: absolute; top: -11px; left: 12px; background: var(--thumbs); color: var(--on-accent); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .tframe { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--sunk); }
  .tgrid.small .tframe { width: 168px; }
  .tframe img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tgrid.f-protan img { filter: url(#f-protan); }
  .tgrid.f-deutan img { filter: url(#f-deutan); }
  .tgrid.f-tritan img { filter: url(#f-tritan); }
  .tgrid.f-blur img { filter: blur(3px); }
  .ov { position: absolute; inset: 0; pointer-events: none; }
  .ov .ts { position: absolute; right: 4%; bottom: 5%; background: rgb(0 0 0 / 0.82); color: #fff; font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border-radius: 3px; }
  .ov .zone { position: absolute; right: 0; bottom: 0; width: 24%; height: 20%; background: repeating-linear-gradient(45deg, rgb(255 60 120 / 0.28) 0 6px, transparent 6px 12px); border-top: 2px dashed rgb(255 60 120 / 0.9); border-left: 2px dashed rgb(255 60 120 / 0.9); }
  .ov .q { position: absolute; right: 3%; top: 5%; display: flex; flex-direction: column; gap: 4px; }
  .ov .q i { width: 22px; height: 22px; border-radius: 3px; background: rgb(0 0 0 / 0.7); display: block; }
  .tname { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .tname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xbtn { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .checks li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
  .checks li::before { font-weight: 700; }
  .checks li.ok::before { content: "\2713"; color: var(--ok); }
  .checks li.warn::before { content: "!"; color: var(--warn); text-align: center; }
  .score { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .score .total { display: flex; align-items: baseline; gap: 8px; }
  .score .total b { font-size: 34px; font-family: var(--font-mono); color: var(--thumbs); font-variant-numeric: tabular-nums; }
  .subs { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-size: 12px; }
  .subs .bar { --c: var(--thumbs); }
  .subs .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .why { font-size: 14px; }
  .dropzone { border: 2px dashed var(--line); border-radius: var(--radius); padding: 26px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--muted); }
  .dropzone.over { border-color: var(--thumbs); color: var(--fg); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* files */
  .rule { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px; }
  .tokens { display: flex; gap: 6px; flex-wrap: wrap; }
  .tokens button { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 3px 7px; cursor: pointer; }
  .tokens button:hover { border-color: var(--files); }
  .locked { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table.ft { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
  table.ft th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 10px; border-bottom: 1px solid var(--line); background: var(--sunk); }
  table.ft td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.ft tr:last-child td { border-bottom: 0; }
  table.ft tr.wait td { color: var(--muted); }
  table.ft tr.active td { background: color-mix(in srgb, var(--files) 8%, transparent); }
  table.ft input[type="text"] { font-family: var(--font-mono); font-size: 12px; padding: 6px 8px; }
  table.ft select { padding: 6px 8px; font-size: 13px; }
  .orig { font-family: var(--font-mono); font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frames { display: flex; gap: 3px; }
  .frames i { width: 26px; height: 15px; border-radius: 2px; background: var(--sunk); display: block; }
  .tree { font-family: var(--font-mono); font-size: 13px; background: var(--sunk); border-radius: 6px; padding: 12px 14px; overflow-x: auto; line-height: 1.7; }
  .tree .d { font-weight: 600; }
  .tree .f { padding-left: 22px; color: var(--muted); white-space: nowrap; }
  .tree .sub { padding-left: 14px; }

  /* billing */
  .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .plan { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .plan.cur { border: 2px solid var(--money); }
  .plan .price { font-family: var(--font-mono); font-size: 28px; font-weight: 600; }
  .plan .price small { font-size: 14px; color: var(--muted); }
  .plan ul { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 5px; }
  .plan .btn { margin-top: auto; justify-content: center; }
  .usage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 22px; }
  .u { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .u .lbl { display: flex; justify-content: space-between; gap: 8px; }
  .u .lbl span:last-child { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  table.cost { border-collapse: collapse; font-size: 14px; width: 100%; font-variant-numeric: tabular-nums; }
  table.cost td, table.cost th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  table.cost td:last-child, table.cost th:last-child { text-align: right; font-family: var(--font-mono); }
  table.cost th { font-size: 12px; color: var(--muted); }

  /* overlay: modal + drawer */
  .scrim { position: fixed; inset: 0; background: rgb(10 12 16 / 0.5); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); border-radius: 10px; max-width: 440px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgb(0 0 0 / 0.3); }
  .modal h2 { font-size: 21px; }
  .modal .row { justify-content: flex-end; }
  .scrim.side { justify-content: flex-end; align-items: stretch; padding: 0; }
  .drawer { background: var(--surface); width: min(420px, 100%); height: 100%; padding: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px)); padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .drawer .row:last-child { margin-top: auto; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / 0.25); }

  @media (max-width: 960px) {
    .upnext { grid-template-columns: 1fr 1fr; }
    .tgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .idea-input { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 30; flex-direction: row; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); border-right: 0; border-top: 1px solid var(--line); }
    .brand, .rail-usage { display: none; }
    .nav { flex-direction: row; flex: 1; justify-content: space-around; }
    .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 4px; }
    .nav a.on { box-shadow: inset 0 3px 0 var(--c, var(--fg)); }
    .main { padding-bottom: 110px; }
    .tiles, .upnext, .plans, .usage, .rule { grid-template-columns: 1fr; }
    .board { grid-template-columns: repeat(5, minmax(220px, 82%)); scroll-snap-type: x mandatory; }
    .col { scroll-snap-align: start; }
    .toast { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (max-width: 480px) { .tgrid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = s => String(s).toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const lim = n => n === Infinity ? 'Unlimited' : n.toLocaleString();

  const PLANS = {
    free: { name: 'Free', price: 0, projects: 10, scores: 3, files: 25, ideaRuns: 10, rules: false, notion: false, drive: false, spaces: 1 },
    creator: { name: 'Creator', price: 25, projects: Infinity, scores: 50, files: 500, ideaRuns: Infinity, rules: true, notion: true, drive: false, spaces: 1 },
    pro: { name: 'Pro', price: 40, projects: Infinity, scores: 150, files: 2000, ideaRuns: Infinity, rules: true, notion: true, drive: true, spaces: 5 }
  };
  const COST = { scores: 0.011, files: 0.004, ideaRuns: 0.045 };
  const STATUSES = [['idea', 'Idea'], ['planning', 'Planning'], ['filming', 'Filming'], ['editing', 'Editing'], ['published', 'Published']];
  const FORMATS = ['Vlog', 'GRWM', 'Day in my life', 'Routine', 'Haul', 'Try-on', 'Home tour', 'Comparison', 'Q&A', 'Tutorial'];
  const TYPES = {
    aroll: { label: 'A-roll', key: 'aroll', folder: 'A-roll' },
    broll: { label: 'B-roll', key: 'broll', folder: 'B-roll' },
    talking: { label: 'Talking head', key: 'talking', folder: 'Talking head' },
    vo: { label: 'Voiceover', key: 'vo', folder: 'Voiceover' },
    music: { label: 'Music', key: 'music', folder: 'Music' },
    screenshot: { label: 'Screenshot', key: 'screenshot', folder: 'Screenshots' },
    photo: { label: 'Photo', key: 'photo', folder: 'Photos' }
  };
  const tcolor = t => `var(--t-${t})`;

  const SAMPLE_NOTES = `fall reset vlog?? deep clean + new candles + closet swap
GRWM for a wedding, ppl keep asking about my hair
what I eat in a day but realistic (not the 1200 cal stuff)
cozy amazon home finds under $50
glossier sent PR, need to post by nov 8 #ad
buy new ring light before filming anything else
thumbnail idea: me holding coffee in the fall leaves
morning routine 5am vs 9am which one actually works`;

  const SEED = () => [
    { id: 1, title: 'My apartment tour, empty to cozy', hook: 'Six months, one small budget, zero regrets.', format: 'Home tour', status: 'editing', notes: 'Need B-roll of the reading nook at golden hour.', brand: '', due: '' },
    { id: 2, title: 'Sunday reset routine', hook: 'The 3 hours that make my whole week easier.', format: 'Routine', status: 'published', notes: '', brand: '', due: '' },
    { id: 3, title: 'Fall capsule wardrobe in 30 pieces', hook: 'Thirty pieces. A whole season of outfits.', format: 'Try-on', status: 'planning', notes: 'Pull pieces Thursday. Shoot in the bedroom by the window.', brand: '', due: '' },
    { id: 4, title: 'A week of slow mornings', hook: 'I stopped checking my phone first thing. Here is what changed.', format: 'Vlog', status: 'filming', notes: 'Mention the Calm code in the first 2 minutes.', brand: 'Calm', due: '2026-11-03' },
    { id: 5, title: 'Trying viral TikTok recipes', hook: 'Five recipes, one honest ranking.', format: 'Day in my life', status: 'idea', notes: '', brand: '', due: '' }
  ];

  const MOCK_FILES = [
    { orig: 'IMG_2201.MOV', size: '1.2 GB', len: '3:40', type: 'talking', desc: 'couch intro', what: 'Talking to camera on the couch, intro for the vlog', date: '2026-10-26' },
    { orig: 'IMG_2202.MOV', size: '980 MB', len: '2:58', type: 'talking', desc: 'grwm mirror', what: 'Mirror GRWM, doing makeup and chatting', date: '2026-10-26' },
    { orig: 'IMG_2205.MOV', size: '340 MB', len: '0:22', type: 'broll', desc: 'iced coffee pour', what: 'Slow motion oat milk pour into iced coffee', date: '2026-10-26' },
    { orig: 'IMG_2207.MOV', size: '410 MB', len: '0:31', type: 'broll', desc: 'lighting candle', what: 'Close-up of lighting a candle on the coffee table', date: '2026-10-26' },
    { orig: 'IMG_2210.MOV', size: '2.4 GB', len: '6:15', type: 'aroll', desc: 'closet swap', what: 'Swapping summer clothes for fall, talking while folding', date: '2026-10-27' },
    { orig: 'IMG_2214.MOV', size: '520 MB', len: '0:40', type: 'broll', desc: 'park leaves walk', what: 'Handheld walk through fall leaves in the park', date: '2026-10-27' },
    { orig: 'voiceover_outro.m4a', size: '18 MB', len: '1:12', type: 'vo', desc: 'outro', what: 'Audio only. Outro voiceover with the Glossier mention', date: '2026-10-27' },
    { orig: 'epidemic_cozy_acoustic.mp3', size: '8 MB', len: '3:05', type: 'music', desc: 'cozy acoustic', what: 'Audio only. Soft acoustic background track', date: '2026-10-20' },
    { orig: 'IMG_2219.HEIC', size: '3 MB', len: '', type: 'photo', desc: 'outfit flat lay', what: 'Flat lay of the fall outfit, good for an Instagram post', date: '2026-10-27' },
    { orig: 'Screenshot 2026-10-25 at 10.02.11 AM.png', size: '1 MB', len: '', type: 'screenshot', desc: 'glossier brief', what: 'Glossier brand brief with talking points and posting date', date: '2026-10-25' }
  ];

  const fresh = () => ({
    plan: 'free',
    usage: { scores: 0, files: 0, ideaRuns: 0 },
    projects: SEED(), nextId: 6, freshIds: [],
    ideas: { text: SAMPLE_NOTES, busy: false, result: null, pending: [] },
    thumbs: { title: 'My slow fall morning routine (cozy and realistic)', items: [], view: 'normal', overlay: true, busy: false, nextId: 1 },
    files: { stage: 'empty', rows: [], project: 'fall-reset-vlog', rule: '{date}_{project}_{type}_{desc}', scanned: 0, tree: null }
  });
  let state = fresh();
  let modalOpen = null; // {kind, ...}

  const P = () => PLANS[state.plan];
  const TODAY = new Date('2026-10-28T12:00:00');
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const dueLabel = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return MONTHS[m - 1] + ' ' + d; };
  const daysLeft = iso => iso ? Math.round((new Date(iso + 'T12:00:00') - TODAY) / 86400000) : null;
  const dealChip = p => { if (!p.brand) return ''; const dl = daysLeft(p.due); return `<span class="chip deal ${dl != null && dl <= 7 ? 'soon' : ''}">${esc(p.brand)}${p.due ? ' \u00b7 post by ' + dueLabel(p.due) : ''}</span>`; };
  const left = k => Math.max(0, P()[k] - state.usage[k]);

  /* ---------- toast ---------- */
  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ---------- routing ---------- */
  const VIEWS = ['home', 'ideas', 'thumbnails', 'files', 'plan'];
  const view = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : 'home'; };

  function render() {
    const v = view();
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.view === v));
    document.querySelectorAll('#planseg button').forEach(b => b.classList.toggle('on', b.dataset.plan === state.plan));
    $('#view').innerHTML = ({ home: vHome, ideas: vIdeas, thumbnails: vThumbs, files: vFiles, plan: vPlan })[v]();
    renderRail();
    renderOverlay();
  }

  function usageBar(k, label, cls = '') {
    const cap = P()[k]; const used = state.usage[k];
    const pct = cap === Infinity ? Math.min(100, used ? 4 : 0) : Math.min(100, used / cap * 100);
    return `<div class="u ${cls}"><div class="lbl"><span>${label}</span><span>${used} of ${lim(cap)}</span></div><div class="bar ${cap !== Infinity && used >= cap ? 'full' : ''}"><i style="width:${pct}%"></i></div></div>`;
  }
  function renderRail() {
    const projCap = P().projects;
    $('#rail-usage').innerHTML = `
      <div class="muted" style="font-weight:700">This month on ${P().name}</div>
      ${railRow('Projects', state.projects.length, projCap, 'ideas')}
      ${railRow('AI thumbnail scores', state.usage.scores, P().scores, 'thumbs')}
      ${railRow('Files sorted', state.usage.files, P().files, 'files')}`;
  }
  function railRow(label, used, cap, cls) {
    const pct = cap === Infinity ? 3 : Math.min(100, used / cap * 100);
    return `<div class="${cls}"><div class="lbl"><span>${label}</span><span class="mono">${used}/${cap === Infinity ? '∞' : cap}</span></div><div class="bar ${cap !== Infinity && used >= cap ? 'full' : ''}"><i style="width:${pct}%"></i></div></div>`;
  }

  function steps(list, now) {
    return `<ol class="steps">${list.map((s, i) => `<li class="${i < now ? 'done' : i === now ? 'now' : ''}"><span><b>${i + 1}</b></span>${s}</li>`).join('')}</ol>`;
  }

  /* ---------- HOME ---------- */
  function vHome() {
    const by = s => state.projects.filter(p => p.status === s);
    const next = by('filming')[0] || by('planning')[0] || by('idea')[0];
    const scored = state.thumbs.items.filter(t => t.score).length;
    const deals = state.projects.filter(p => p.brand && p.status !== 'published').sort((a, b) => (a.due || '9') < (b.due || '9') ? -1 : 1);
    return `
      <div class="phead"><h1>What are we prepping today?</h1><p>Pick one. Each tool does one job and tells you the next step.</p></div>
      <div class="tiles">
        <a class="tile ideas" href="#ideas"><h2>Plan my content</h2><p>Brain dump your ideas. Get video cards, with brand deals flagged.</p><span class="stat">${state.projects.length} videos planned. ${by('filming').length} filming now.</span><span class="go">Open Ideas</span></a>
        <a class="tile thumbs" href="#thumbnails"><h2>Test thumbnails</h2><p>Upload 2 to 6. See which one people will actually click.</p><span class="stat">${scored ? scored + ' scored so far.' : 'No tests yet.'} ${left('scores')} AI scores left.</span><span class="go">Open Thumbnails</span></a>
        <a class="tile files" href="#files"><h2>Clean up my footage</h2><p>All those IMG_2201 clips, named and sorted into folders.</p><span class="stat">${left('files')} files left this month.</span><span class="go">Open Files</span></a>
      </div>
      <div class="upnext">
        <div class="panel ideas"><span class="bigq">Up next</span>${next ? `<h2 style="font-size:20px">${esc(next.title)}</h2><p class="muted">${esc(next.hook)}</p><div class="row"><span class="chip" style="--chip:var(--ideas)">${STATUSES.find(s => s[0] === next.status)[1]}</span><span class="chip">${esc(next.format)}</span>${dealChip(next)}</div>` : '<p class="muted">Nothing in progress. Add an idea to get started.</p>'}</div>
        <div class="panel"><span class="bigq">Brand deals due</span>${deals.length ? `<ul class="deals">${deals.map(p => { const dl = daysLeft(p.due); return `<li><span><b>${esc(p.brand)}</b> ${esc(p.title)}</span><span class="chip deal ${dl != null && dl <= 7 ? 'soon' : ''}">${p.due ? (dl < 0 ? 'overdue' : dl === 0 ? 'today' : dl + ' days') : 'no date'}</span></li>`; }).join('')}</ul>` : '<p class="muted">No brand deals in progress.</p>'}</div>
        <div class="panel money"><span class="bigq">This month on ${P().name}</span>${usageBar('scores', 'AI thumbnail scores')}${usageBar('files', 'Files sorted')}${usageBar('ideaRuns', 'Idea sorting runs')}</div>
      </div>`;
  }

  /* ---------- IDEAS ---------- */
  function vIdeas() {
    const I = state.ideas;
    const step = I.result ? 2 : I.busy ? 1 : 0;
    const cap = P().projects;
    return `
      <div class="phead ideas"><h1>Ideas</h1><p>Dump everything from your Notes app. Spelling and order do not matter. Brand deals get pulled out with their post-by dates.</p>${steps(['Paste notes', 'Sort with AI', 'Drag cards'], step)}</div>
      <div class="idea-input ideas">
        <div class="panel">
          <label class="fld" for="idea-text">Brain dump</label>
          <textarea id="idea-text" rows="9" placeholder="One thought per line works best">${esc(I.text)}</textarea>
          <div class="row">
            <button class="btn primary" data-act="organize" ${I.busy ? 'disabled' : ''}>${I.busy ? '<span class="spinner"></span>Sorting your notes' : 'Sort my ideas'}</button>
            <span class="hint">${P().ideaRuns === Infinity ? 'Unlimited runs' : `<b>${left('ideaRuns')}</b> of ${P().ideaRuns} runs left`}. Projects: <b>${state.projects.length}</b> of ${lim(cap)}.</span>
          </div>
        </div>
        <div class="panel result">${ideaResult()}</div>
      </div>
      <div class="board ideas" id="board">
        ${STATUSES.map(([k, label]) => {
          const cards = state.projects.filter(p => p.status === k);
          return `<section class="col" data-col="${k}" aria-label="${label}">
            <div class="col-head"><span>${label}</span><span class="n">${cards.length}</span></div>
            ${cards.map(p => `<button type="button" class="card ${state.freshIds.includes(p.id) ? 'fresh' : ''}" draggable="true" data-card="${p.id}" data-act="open-card"><b>${esc(p.title)}</b><span class="hook">${esc(p.hook)}</span><span class="tags"><span class="chip">${esc(p.format)}</span>${dealChip(p)}</span></button>`).join('')}
            ${k === 'idea' ? '<button type="button" class="addcard" data-act="add-card">+ Add a card</button>' : ''}
          </section>`;
        }).join('')}
      </div>
      <p class="hint">Drag a card to move it. On a phone, tap a card and change its status.</p>`;
  }
  function ideaResult() {
    const r = state.ideas.result;
    if (state.ideas.busy) return `<h3>Sorting</h3><p class="muted">Grouping your notes and writing a title and hook for each video.</p>`;
    if (!r) return `<h3>What you will get</h3><ul><li>A card for each video idea, with a working title and hook</li><li>Brand deals flagged, with the post-by date</li><li>To-dos pulled out so they stop cluttering ideas</li><li>Thumbnail notes attached to the right card</li></ul><p class="empty">Nothing sorted yet. Hit the button.</p>`;
    return `<h3>Sorted ${r.total} notes</h3>
      <div><span class="chip" style="--chip:var(--ideas)">${r.added.length} new cards</span> ${r.deals ? `<span class="chip deal">${r.deals} brand deal${r.deals > 1 ? 's' : ''}</span> ` : ''}<span class="chip">${r.todos.length} to-dos</span> <span class="chip">${r.thumbs.length} thumbnail notes</span></div>
      ${r.todos.length ? `<div><b>To-dos</b><ul>${r.todos.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
      ${r.thumbs.length ? `<div><b>Thumbnail notes</b><ul>${r.thumbs.map(t => `<li>${esc(t.text)}${t.to ? ` <span class="muted">added to "${esc(t.to)}"</span>` : ''}</li>`).join('')}</ul></div>` : ''}
      ${state.ideas.pending.length ? `<div class="panel" style="border-color:var(--warn);padding:12px"><b>${state.ideas.pending.length} idea${state.ideas.pending.length > 1 ? 's' : ''} did not fit.</b><span class="muted">Free holds 10 projects. Nothing is lost, they are waiting here.</span><div class="row"><button class="btn primary money" data-act="upgrade-to" data-plan="creator">Get unlimited projects</button></div></div>` : ''}`;
  }

  const KNOWN = [
    [/fall reset/i, { title: 'Fall reset vlog: deep clean, candles and a closet swap', hook: 'Everything I do when the season changes, in one cozy day.', format: 'Vlog' }],
    [/grwm.*wedding|wedding.*grwm/i, { title: 'GRWM for a wedding (the hair everyone asks about)', hook: 'You asked about the hair. Every step, start to finish.', format: 'GRWM' }],
    [/what i eat/i, { title: 'What I eat in a day, the realistic version', hook: 'No 1,200 calorie stuff. Just what I actually eat.', format: 'Day in my life' }],
    [/amazon home/i, { title: 'Cozy Amazon home finds under $50', hook: 'Twelve things that make my place feel expensive. All under $50.', format: 'Haul' }],
    [/glossier/i, { title: 'Glossier PR unboxing and first impressions', hook: 'Glossier sent me a box. Honest thoughts, no script.', format: 'Haul', brand: 'Glossier', due: '2026-11-08' }],
    [/5am vs 9am/i, { title: '5am vs 9am morning routine: which one actually works', hook: 'I tried both for a week. One of them changed my whole day.', format: 'Comparison' }]
  ];
  const HOOKS = { Vlog: 'Come along for the whole thing.', GRWM: 'Get ready with me and catch up.', 'Day in my life': 'A real day, nothing staged.', Routine: 'The routine that keeps me sane.', Haul: 'Everything I bought, and what I would return.', 'Try-on': 'Every piece, styled three ways.', 'Home tour': 'Come see the whole place.', Comparison: 'I tried both so you do not have to.', 'Q&A': 'Your questions, my honest answers.', Tutorial: 'Step by step, nothing skipped.' };
  function guessFormat(s) {
    if (/grwm|get ready/i.test(s)) return 'GRWM';
    if (/\bvs\.?\b|versus|compar/i.test(s)) return 'Comparison';
    if (/what i eat|day in (my|the) life|diml/i.test(s)) return 'Day in my life';
    if (/routine|reset/i.test(s)) return 'Routine';
    if (/haul|finds|favorites|faves|unbox/i.test(s)) return 'Haul';
    if (/try.?on|outfit|closet|wardrobe|lookbook/i.test(s)) return 'Try-on';
    if (/home tour|apartment|room tour|decor/i.test(s)) return 'Home tour';
    if (/q ?& ?a|questions/i.test(s)) return 'Q&A';
    if (/how to|tutorial|tips/i.test(s)) return 'Tutorial';
    return 'Vlog';
  }
  const BRAND_RE = /#ad\b|#sponsored|sponsor|\bpr\b|gifted|brand deal|paid partnership/i;
  function findDue(s) {
    const m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/i);
    if (!m) return '';
    const mo = MONTHS.findIndex(x => x.toLowerCase() === m[1].slice(0, 3).toLowerCase()) + 1;
    const yr = mo < TODAY.getMonth() + 1 ? 2027 : 2026;
    return `${yr}-${String(mo).padStart(2, '0')}-${String(+m[2]).padStart(2, '0')}`;
  }
  function fakeOrganize(text) {
    const lines = text.split(/\n+/).map(l => l.replace(/^[\s\-*•\d.)]+/, '').trim()).filter(Boolean);
    const ideas = [], todos = [], thumbs = [];
    for (const l of lines) {
      if (!BRAND_RE.test(l) && (/^(buy|need to|todo|to do|email|call|order|book|remind)\b/i.test(l) || /\bbefore filming\b/i.test(l))) { todos.push(l.charAt(0).toUpperCase() + l.slice(1)); continue; }
      if (/thumbnail/i.test(l)) { thumbs.push(l.replace(/^thumbnail( idea)?:?\s*/i, '')); continue; }
      const k = KNOWN.find(([re]) => re.test(l));
      if (k) { ideas.push({ ...k[1], src: l }); continue; }
      if (BRAND_RE.test(l)) {
        const brand = (l.match(/^([A-Za-z][\w&']+)/) || [, 'Brand'])[1];
        const nice = brand.charAt(0).toUpperCase() + brand.slice(1);
        ideas.push({ title: `${nice} sponsored video`, hook: HOOKS[guessFormat(l)], format: guessFormat(l), brand: nice, due: findDue(l), src: l }); continue;
      }
      let t = l.replace(/\?+|!+/g, '').replace(/\b(maybe|ppl|idk|lol)\b/gi, '').replace(/\s+/g, ' ').trim();
      t = t.charAt(0).toUpperCase() + t.slice(1);
      if (t.length > 64) t = t.slice(0, 61).replace(/\s\S*$/, '') + '...';
      const f = guessFormat(l);
      ideas.push({ title: t, hook: HOOKS[f], format: f, src: l });
    }
    return { ideas, todos, thumbs, total: lines.length };
  }
  async function organize() {
    const I = state.ideas;
    if (!I.text.trim()) { toast('Paste a few notes first.'); return; }
    if (left('ideaRuns') <= 0) return upgrade('ideaRuns');
    I.busy = true; render();
    await wait(1400);
    state.usage.ideaRuns++;
    const out = fakeOrganize(I.text);
    const room = P().projects - state.projects.length;
    const fit = out.ideas.slice(0, Math.max(0, room));

          <td><input type="checkbox" data-finc="${i}" ${r.on ? 'checked' : ''} ${F.stage !== 'review' ? 'disabled' : ''} aria-label="Include ${esc(r.orig)}"></td>
          <td>${scanned ? (F.stage === 'review' ? `<select data-ftype="${i}" aria-label="Type">${Object.values(TYPES).map(t => `<option value="${t.key}" ${t.key === r.type ? 'selected' : ''}>${t.label}</option>`).join('')}</select>` : `<span class="chip" style="--chip:${tcolor(r.type)}">${TYPES[r.type].label}</span>`) : '<span class="muted">waiting</span>'}</td>
          <td><div class="orig" title="${esc(r.orig)}">${esc(r.orig)}</div><span class="hint mono">${r.size}${r.len ? ' · ' + r.len : ''}</span></td>
          <td>${scanned ? (F.stage === 'review' ? `<input type="text" data-fname="${i}" value="${esc(r.final)}" aria-label="New name for ${esc(r.orig)}">` : `<span class="mono" style="font-size:12px">${esc(r.final)}</span>`) : active ? '<span class="spinner" style="color:var(--files)"></span>' : ''}</td>
          <td>${scanned ? esc(r.what) : ''}</td>
          <td>${scanned ? `<div class="frames">${r.len ? [0, 1, 2].map(k => `<i style="background:color-mix(in srgb, ${tcolor(r.type)} ${30 + k * 20}%, var(--sunk))"></i>`).join('') : `<i style="background:color-mix(in srgb, ${tcolor(r.type)} 50%, var(--sunk))"></i>`}</div>` : ''}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
  }
  function doneBox() {
    const F = state.files; const groups = {};
    F.rows.filter(r => r.on).forEach(r => { (groups[r.type] ||= []).push(r.final); });
    return `<div class="panel files"><h2 style="font-size:20px">Done. ${F.rows.filter(r => r.on).length} files renamed and sorted.</h2>
      <div class="tree"><div class="d">${esc(slug(F.project) || 'project')}/</div>${Object.entries(groups).map(([k, list]) => `<div class="sub"><div class="d" style="color:${tcolor(k)}">${TYPES[k].folder}/</div>${list.map(f => `<div class="f">${esc(f)}</div>`).join('')}</div>`).join('')}</div>
      <div class="row"><button class="btn" data-act="undo">Undo this</button><button class="btn primary" data-act="files-reset">Sort another folder</button></div></div>`;
  }
  async function scan() {
    const F = state.files; const n = F.rows.length;
    if (n > left('files')) return upgrade('files', n);
    state.usage.files += n;
    F.stage = 'scanning'; F.scanned = 0; render();
    for (let i = 0; i < n; i++) { await wait(320); F.rows[i].scanned = true; F.rows[i].final = makeName(F.rows[i], i); F.scanned = i + 1; if (view() === 'files') render(); }
    F.stage = 'review'; render(); toast('Scan done. Check the names, then sort.');
  }

  /* ---------- PLAN ---------- */
  function vPlan() {
    const u = state.usage; const ai = u.scores * COST.scores + u.files * COST.files + u.ideaRuns * COST.ideaRuns;
    const feats = {
      free: ['Idea board up to 10 videos', '10 idea sorting runs', 'Unlimited accessibility checks', '3 AI thumbnail scores', '25 files sorted'],
      creator: ['Unlimited videos and brand deals', '50 AI thumbnail scores', '500 files sorted', 'Custom naming rules', 'Send winners to Notion'],
      pro: ['Everything in Creator', '150 AI thumbnail scores', '2,000 files sorted', 'Google Drive folders', 'Up to 5 channels, like a second vlog channel', 'Priority processing']
    };
    return `
      <div class="phead money"><h1>Plan</h1><p>You are on <b>${P().name}</b>. In the real app, buttons go to Stripe and cancellation lives in the Stripe portal.</p></div>
      <div class="panel money"><h2 style="font-size:18px">This month</h2><div class="usage">
        ${`<div class="u ideas"><div class="lbl"><span>Projects on the board</span><span>${state.projects.length} of ${lim(P().projects)}</span></div><div class="bar ${P().projects !== Infinity && state.projects.length >= P().projects ? 'full' : ''}"><i style="width:${P().projects === Infinity ? 3 : Math.min(100, state.projects.length / P().projects * 100)}%"></i></div></div>`}
        ${usageBar('ideaRuns', 'Idea sorting runs', 'ideas')}${usageBar('scores', 'AI thumbnail scores', 'thumbs')}${usageBar('files', 'Files sorted', 'files')}
      </div></div>
      <div class="plans">${Object.entries(PLANS).map(([k, p]) => `<div class="plan ${k === state.plan ? 'cur' : ''}">
        <h2 style="font-size:20px">${p.name}</h2><div class="price">$${p.price}<small> / month</small></div>
        <ul>${feats[k].map(f => `<li>${f}</li>`).join('')}</ul>
        ${k === state.plan ? '<button class="btn" disabled>Your plan</button>' : `<button class="btn ${p.price > P().price ? 'primary money' : ''}" data-act="plan" data-plan="${k}">${p.price > P().price ? 'Upgrade to ' : 'Switch to '}${p.name}</button>`}
      </div>`).join('')}</div>
      <div class="panel money"><h2 style="font-size:18px">Owner view: what this user costs you</h2><p class="hint">Only you see this, on a hidden admin page. Numbers come from the AI usage log.</p>
        <div style="overflow-x:auto"><table class="cost"><thead><tr><th>Feature</th><th>Uses</th><th>AI cost</th></tr></thead><tbody>
          <tr><td>Idea sorting</td><td>${u.ideaRuns}</td><td>$${(u.ideaRuns * COST.ideaRuns).toFixed(3)}</td></tr>
          <tr><td>Thumbnail scores</td><td>${u.scores}</td><td>$${(u.scores * COST.scores).toFixed(3)}</td></tr>
          <tr><td>File descriptions</td><td>${u.files}</td><td>$${(u.files * COST.files).toFixed(3)}</td></tr>
          <tr><td><b>Total vs revenue</b></td><td>$${P().price} paid</td><td><b>$${ai.toFixed(2)}</b></td></tr>
        </tbody></table></div></div>`;
  }

  /* ---------- overlay: modal + drawer ---------- */
  const NEED = {
    scores: n => ({ t: n ? `This test needs ${n} scores` : 'Out of AI scores', b: `You have ${left('scores')} of ${P().scores} AI scores left this month. Creator gives you 50 a month. Accessibility checks stay free either way.`, plan: state.plan === 'creator' ? 'pro' : 'creator' }),
    files: n => ({ t: `Scanning needs ${n} files`, b: `You have ${left('files')} of ${P().files} files left this month. Creator sorts 500 a month, Pro sorts 2,000.`, plan: state.plan === 'creator' ? 'pro' : 'creator' }),
    ideaRuns: () => ({ t: 'Out of sorting runs', b: 'Free includes 10 idea sorting runs a month. Creator is unlimited.', plan: 'creator' }),
    projects: () => ({ t: 'Your board is full', b: 'Free holds 10 projects. Creator holds as many as you want.', plan: 'creator' }),
    notion: () => ({ t: 'Notion comes with Creator', b: 'Send the winning thumbnail and the scores straight into your Notion video template.', plan: 'creator' })
  };
  function upgrade(kind, n) { modalOpen = { kind: 'up', ...NEED[kind](n) }; renderOverlay(); }
  function renderOverlay() {
    const o = $('#overlay');
    if (!modalOpen) { o.innerHTML = ''; return; }
    if (modalOpen.kind === 'up') {
      const p = PLANS[modalOpen.plan];
      o.innerHTML = `<div class="scrim" data-act="close-scrim"><div class="modal money" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">${esc(modalOpen.t)}</h2><p>${esc(modalOpen.b)}</p>
        <div class="row"><button class="btn" data-act="close">Not now</button><button class="btn primary" data-act="upgrade-to" data-plan="${modalOpen.plan}">Upgrade to ${p.name}, $${p.price}/mo</button></div></div></div>`;
      o.querySelector('.btn.primary')?.focus();
    } else if (modalOpen.kind === 'card') {
      const p = state.projects.find(x => x.id === modalOpen.id); if (!p) { modalOpen = null; o.innerHTML = ''; return; }
      o.innerHTML = `<div class="scrim side" data-act="close-scrim"><form class="drawer ideas" id="card-form" role="dialog" aria-modal="true" aria-labelledby="d-h">
        <h2 id="d-h" style="font-size:20px">${modalOpen.isNew ? 'New card' : 'Edit card'}</h2>
        <label class="fld" for="d-title">Working title<input type="text" id="d-title" value="${esc(p.title)}"></label>
        <label class="fld" for="d-hook">Hook (first 5 seconds)<textarea id="d-hook" rows="2">${esc(p.hook)}</textarea></label>
        <div class="row"><label class="fld grow" for="d-format">Format<select id="d-format">${FORMATS.map(f => `<option ${f === p.format ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
        <label class="fld grow" for="d-status">Status<select id="d-status">${STATUSES.map(([k, l]) => `<option value="${k}" ${k === p.status ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
        <div class="row"><label class="fld grow" for="d-brand">Brand deal (optional)<input type="text" id="d-brand" value="${esc(p.brand)}" placeholder="Brand name"></label>
        <label class="fld grow" for="d-due">Post by<input type="date" id="d-due" value="${esc(p.due)}"></label></div>
        <label class="fld" for="d-notes">Notes<textarea id="d-notes" rows="5">${esc(p.notes)}</textarea></label>
        <div class="row"><button type="button" class="btn" data-act="del-card">Delete</button><span class="grow"></span><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button></div>
      </form></div>`;
      $('#d-title').focus();
    }
  }

  /* ---------- actions ---------- */
  const A = {
    plan: el => { const old = state.plan; state.plan = el.dataset.plan; render(); if (old !== state.plan) toast(`Now viewing as ${P().name}.`); addPendingIfRoom(); if (view() === 'ideas') render(); },
    'upgrade-to': el => { state.plan = el.dataset.plan; modalOpen = null; render(); toast(`Upgraded to ${P().name}. In the real app this goes through Stripe.`); addPendingIfRoom(); render(); },
    close: () => { if (modalOpen?.isNew) state.projects = state.projects.filter(p => p.id !== modalOpen.id); modalOpen = null; render(); },
    'close-scrim': (el, e) => { if (e.target === el) A.close(); },
    reset: () => { state = fresh(); modalOpen = null; render(); toast('Demo reset.'); },
    organize,
    'open-card': el => { modalOpen = { kind: 'card', id: +el.dataset.card }; renderOverlay(); },
    'add-card': () => {
      if (state.projects.length >= P().projects) return upgrade('projects');
      const p = { id: state.nextId++, title: '', hook: '', format: 'Vlog', status: 'idea', notes: '', brand: '', due: '' };
      state.projects.push(p); modalOpen = { kind: 'card', id: p.id, isNew: true }; renderOverlay();
    },
    'del-card': () => { state.projects = state.projects.filter(p => p.id !== modalOpen.id); modalOpen = null; render(); toast('Card deleted.'); },
    'pick-thumbs': () => $('#thumb-file').click(),
    'sample-thumbs': () => { addThumb('5am-reset-face.jpg', drawSample('a'), 'a'); addThumb('beige-aesthetic-script.jpg', drawSample('b'), 'b'); addThumb('fall-haul-flatlay.jpg', drawSample('c'), 'c'); },
    'rm-thumb': el => { state.thumbs.items = state.thumbs.items.filter(t => t.id !== +el.dataset.id); render(); },
    tview: el => { state.thumbs.view = el.dataset.v; render(); },
    score,
    notion: () => { if (!P().notion) return upgrade('notion'); toast('Sent to your Notion template. (Demo)'); },
    'load-folder': () => { const F = state.files; F.rows = MOCK_FILES.map(f => ({ ...f, on: true, scanned: false, edited: false, final: '' })); F.stage = 'found'; render(); },
    'files-reset': () => { const F = state.files; F.stage = 'empty'; F.rows = []; F.tree = null; render(); },
    scan,
    token: el => { const inp = $('#f-rule'); if (!inp) return; const t = el.dataset.t; const s = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, s) + t + inp.value.slice(inp.selectionEnd ?? s); state.files.rule = inp.value; refreshNames(); inp.focus(); },
    apply: () => { const F = state.files; if (!F.rows.some(r => r.on)) { toast('Pick at least one file.'); return; } F.stage = 'done'; render(); toast('Renamed and sorted. Undo log saved.'); },
    undo: () => { state.files.stage = 'review'; render(); toast('Undone. Files are back to their original names.'); }
  };
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (f) f(el, e); });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'idea-text') state.ideas.text = t.value;
    else if (t.id === 'thumb-title') state.thumbs.title = t.value;
    else if (t.id === 'f-project') { state.files.project = t.value; refreshNames(); }
    else if (t.id === 'f-rule') { state.files.rule = t.value; refreshNames(); }
    else if (t.dataset.fname != null) { const r = state.files.rows[+t.dataset.fname]; r.final = t.value; r.edited = true; }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'thumb-file') { addThumbFiles(t.files); t.value = ''; }
    else if (t.id === 't-overlay') { state.thumbs.overlay = t.checked; render(); }
    else if (t.dataset.ftype != null) { const i = +t.dataset.ftype; const r = state.files.rows[i]; r.type = t.value; r.edited = false; refreshNames(); render(); }
    else if (t.dataset.finc != null) { state.files.rows[+t.dataset.finc].on = t.checked; render(); }
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'card-form') return; e.preventDefault();
    const p = state.projects.find(x => x.id === modalOpen.id);
    p.title = $('#d-title').value.trim() || 'Untitled idea'; p.hook = $('#d-hook').value.trim(); p.format = $('#d-format').value; p.status = $('#d-status').value; p.notes = $('#d-notes').value; p.brand = $('#d-brand').value.trim(); p.due = $('#d-due').value;
    modalOpen = null; render(); toast('Saved.');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen) A.close(); });
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  function start(data) {
    if (data && data.state) { state = data.state; }
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  window.__demo = { analyze, drawSample, A, get state() { return state; } };
})();
</script>
